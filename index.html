<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>返潮</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="game-shell">
    <header id="topbar">
      <div class="identity">
        <span class="mark">第 <i id="loop-mark">1</i> 遍</span>
          <strong>返潮</strong>
      </div>
      <div class="clock-group">
        <a class="guide-link" href="guide.html" target="_blank">攻略与关系图</a>
        <span id="act-label">校准</span>
        <time id="world-clock">00:00.0</time>
        <span id="pause-state">运行中</span>
      </div>
    </header>

    <section id="stage-wrap">
      <canvas id="stage" width="960" height="576" aria-label="游戏场景"></canvas>
      <div id="prophecy" class="prophecy hidden">
        <span class="prophecy-kicker">已认证的未来</span>
        <p id="prophecy-text"></p>
        <div class="timer-track"><i id="prophecy-progress"></i></div>
      </div>
      <div id="curtain" class="curtain">
        <div class="title-block">
          <span>交互叙事原型</span>
          <h1>返潮</h1>
          <p>“再讲一遍。别替她省略。”</p>
          <button id="start-button">开始讲述</button>
        </div>
      </div>
    </section>

    <section id="lower-panel">
      <div id="transcript" aria-live="polite"></div>
      <aside id="status-panel">
        <div class="status-head">
          <strong>仍成立的事故史</strong>
          <span id="world-count">648</span>
        </div>
        <div id="world-meter"><i></i></div>
        <dl id="status-list"></dl>
      </aside>
    </section>

    <section id="command-bar" class="hidden">
      <span class="prompt">&gt;</span>
      <input id="command-input" autocomplete="off" spellcheck="false" placeholder="描述你要做的事，例如：把盆放在漏水下面">
      <button id="submit-command">执行</button>
      <button id="cancel-command" class="icon-button" title="取消">×</button>
    </section>

    <div id="tutorial-card" class="hidden">
      <span id="tutorial-step"></span>
      <p id="tutorial-text"></p>
    </div>
  </main>
  <script type="module" src="src/game.js"></script>
</body>
</html>
